name: Vérification

on:
  pull_request:

permissions:
  contents: read

jobs:
  supports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Vérifier la syntaxe JavaScript
        run: node --check js/content-redesign.js && node --check data/slides/slides.js && node --check tools/check.mjs
      - name: Vérifier les supports
        run: node tools/check.mjs
      - name: Vérifier les espaces dans le diff
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
